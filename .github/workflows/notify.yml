name: Gradescope deadline notifier

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may run it a bit late)
  workflow_dispatch:          # lets you click "Run workflow" manually

permissions:
  contents: write             # needed to save sent.json back to the repo

concurrency:
  group: notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python notify.py
        env:
          GS_EMAIL: ${{ secrets.GS_EMAIL }}
          GS_PASSWORD: ${{ secrets.GS_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save which notifications were sent
        run: |
          if ! git diff --quiet sent.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
            git add sent.json
            git commit -m "Update sent notifications"
            git push
          fi
